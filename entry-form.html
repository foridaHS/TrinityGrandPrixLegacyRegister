<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>

let choiceInstances = []; 
const umaRoster = ["Special Week", "Silence Suzuka", "Tokai Teio", "Maruzensky", "Fuji Kiseki", "Oguri Cap", "Gold Ship", "Vodka", "Daiwa Scarlet", "Grass Wonder", "El Condor Pasa", "Symboli Rudolf", "Air Groove", "Agnes Tachyon", "Manhattan Cafe", "Mihono Bourbon", "Rice Shower", "Agnes Digital", "Mejiro McQueen"];

document.addEventListener('DOMContentLoaded', function() {
    
    function initForm() {
        const selects = document.querySelectorAll('.uma-select');
        
        selects.forEach((select) => {
            const instance = new Choices(select, {
                searchEnabled: true,
                placeholder: true,
                placeholderValue: 'Select a Horse...',
                itemSelectText: '',
                shouldSort: false,
                allowHTML: true
            });
            choiceInstances.push(instance);
        });

        refreshAllDropdowns();

        document.getElementById('umaRegistrationForm').addEventListener('change', () => {
            refreshAllDropdowns();
        });
    }

    function refreshAllDropdowns() {
        const allSelected = choiceInstances.map(inst => inst.getValue(true)).filter(val => val !== "");

        choiceInstances.forEach(instance => {
            const currentSelectedValue = instance.getValue(true);
            const choicesList = umaRoster.map(name => {
                const isTakenBySomeoneElse = allSelected.includes(name) && name !== currentSelectedValue;
                return {
                    value: name,
                    label: name,
                    selected: name === currentSelectedValue,
                    disabled: isTakenBySomeoneElse
                };
            });
            instance.setChoices(choicesList, 'value', 'label', true);
        });
    }

    initForm();
});
    
document.getElementById('umaRegistrationForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const trainer = document.getElementById('trainerName').value;
    const horseIds = ['mile_1', 'mile_2', 'mile_3', 'medium_1', 'medium_2', 'medium_3', 'long_1', 'long_2', 'long_3'];
    
    // Validate all 9 are picked
    const selectedNames = choiceInstances.map(inst => inst.getValue(true)).filter(v => v);
    if (selectedNames.length < 9) {
        alert("⚠️ Please select all 9 Uma Musume before registering.");
        return;
    }

    alert("Registering your roster to Lavitar Racing Club...");

    const uploadPromises = horseIds.map((id, index) => {
        const horseName = choiceInstances[index].getValue(true);
        let category = index < 3 ? "Miles" : (index < 6 ? "Medium" : "Long");

        // --- FIX: Define the imageUrl variable here ---
        const generatedImageUrl = `assets/icon_${horseName.toLowerCase().replace(/\s+/g, '_')}.png`;

        const horseData = {
            trainer: trainer,
            horsename: horseName,        // lowercase to match Sheety
            imageurl: generatedImageUrl, // using the variable we just defined
            category: category,
            speed: parseInt(document.getElementById(`${id}_spd`).value) || 0,
            stamina: parseInt(document.getElementById(`${id}_stm`).value) || 0,
            power: parseInt(document.getElementById(`${id}_pwr`).value) || 0,
            gut: parseInt(document.getElementById(`${id}_gut`).value) || 0,
            wit: parseInt(document.getElementById(`${id}_wit`).value) || 0,
            strategy: document.getElementById(`${id}_strat`).value,
            fanvote: parseInt(document.getElementById(`${id}_fans`).value) || 0
        };

        return fetch('https://api.sheety.co/4b7d2f10221a5c970b5a271824da927d/lavitarContenderList/sheet1', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sheet1: horseData }) 
        });
    });

    try {
        await Promise.all(uploadPromises);
        alert("✅ Success! All 9 horses are registered.");
        window.location.href = "index.html";
    } catch (err) {
        console.error(err);
        alert("❌ Error: Registration failed. Check console for details.");
    }
});

    </script>
